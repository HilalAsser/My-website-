<!DOCTYPE html>
<html>
<head>
    <title>My Home Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7ff;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            padding: 30px 20px;
            text-align: center;
        }

        .container h2 {
            font-size: 28px;
        }

        .container p {
            color: #555;
            font-size: 17px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .card {
            background: white;
            width: 150px;
            padding: 25px 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
        }

        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>My Website 🏠</h1>
    </div>

    <div class="container">

        <h2>Welcome! 👋</h2>

        <p>
            Welcome to my first website.
            I am learning Web Development.
        </p>

        <div class="cards">

            <div class="card">
                <h3>🌐 Website</h3>
                <p>My personal website</p>
            </div>

            <div class="card">
                <h3>💻 Skills</h3>
                <p>HTML, CSS & JavaScript</p>
            </div>

            <div class="card">
                <h3>📞 Contact</h3>
                <p>Contact me here</p>
            </div>

        </div>

    </div>

    <div class="footer">
        © 2026 My Website
    </div>

</body>
</html>
